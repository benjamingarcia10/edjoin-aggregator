name: Deploy to GitHub Pages

# Publishes the static site (public/ + the runtime data file) on every push to main.
# The app is pure static files — no build step — so we just assemble and upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; cancel superseded runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp public/index.html public/app.js public/styles.css _site/
          cp data/jobs.geo.json _site/data/
          # let GitHub Pages serve .json without Jekyll processing
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
