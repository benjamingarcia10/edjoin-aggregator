name: Deploy to GitHub Pages

# Publishes the static site (public/ + the runtime data file). Runs on every push
# to main, on manual dispatch, and when called by refresh.yml (workflow_call) after
# it commits fresh data. The app is pure static files — no build step.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: {} # let refresh.yml reuse this exact deploy as a job

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; cancel superseded runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy the CURRENT tip of main, not the run's pinned github.sha. This
      # matters when refresh.yml calls us right after pushing fresh data: a
      # workflow_call job inherits the caller run's SHA (the pre-refresh commit),
      # so a default checkout would publish stale data. `ref: main` fetches the
      # branch tip — i.e. the data the refresh job just committed.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r public/. _site/            # copy all of public/ so new assets aren't dropped
          cp data/jobs.geo.json _site/data/
          # let GitHub Pages serve .json without Jekyll processing
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
