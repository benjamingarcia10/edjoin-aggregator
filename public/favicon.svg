<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Edjoin Radius — education jobs by radius">
  <rect width="32" height="32" rx="7" fill="#14161b"/>
  <!-- radius ring (teal dashed, like the app's search circle) -->
  <circle cx="16" cy="16" r="12.6" fill="none" stroke="#2bb8af" stroke-width="1.5" stroke-dasharray="2.8 2.4"/>
  <!-- cap + tassel, vertically centered on the ring (centroid ≈ y16) -->
  <!-- cap head / base (the part worn on the head) -->
  <path d="M11 15.2 H21 V19.8 Q21 22 16 22 Q11 22 11 19.8 Z" fill="#ec6a1e"/>
  <!-- mortarboard: flat board as a diamond -->
  <path d="M16 9.9 L27 14.6 L16 19.3 L5 14.6 Z" fill="#ec6a1e"/>
  <!-- center button (gold) -->
  <circle cx="16" cy="14.6" r="1.1" fill="#f5c451"/>
  <!-- tassel (gold): from the button, draped over the right edge, hanging to a tuft -->
  <path d="M16 14.6 Q21.5 15.3 23 16.7 L23 20.6" fill="none" stroke="#f5c451" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="23" cy="21.3" r="1.5" fill="#f5c451"/>
</svg>
